<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的校园博客 | 民大清新主题</title>
  <style>
    /* 民大红色主色调配色变量 */
    :root {
      --primary-color: #C8102E;    /* 主色：民大红 */
      --secondary-color: #F5F5F5;  /* 辅助色：浅灰背景 */
      --text-color: #333333;       /* 正文色：深灰 */
      --light-text: #666666;       /* 次要文字色：中灰 */
      --bg-color: #FFFFFF;         /* 背景色：纯白 */
      --card-bg: #FFFFFF;          /* 卡片背景：纯白 */
      --border-color: #E2E8F0;     /* 边框色：浅灰 */
    }

    /* 全局样式 */
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    /* 头部导航栏（Logo+副标题+用户头像） */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      text-align: left;
    }

    /* Logo文字 */
    .site-logo {
      font-size: 28px;
      font-weight: bold;
      color: var(--primary-color);
      margin: 0;
    }

    /* 副标题 */
    .site-subtitle {
      font-size: 16px;
      color: var(--light-text);
      margin: 8px 0 0;
    }

    /* 用户头像入口 */
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--primary-color);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
    }

    /* 轮播图容器 */
    .carousel {
      width: 100%;
      height: 400px;
      overflow: hidden;
      border-radius: 12px;
      margin: 30px auto;
      border: 1px solid var(--border-color);
      max-width: 1200px;
    }

    .carousel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 博客内容区 */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* 大卡片样式 */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    .card-cover {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .card-content {
      padding: 20px;
    }

    .card-title {
      font-size: 22px;
      font-weight: bold;
      color: var(--primary-color);
      margin: 0 0 10px;
    }

    .card-excerpt {
      color: var(--light-text);
      line-height: 1.6;
      margin: 0 0 15px;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      color: #94A3B8;
      font-size: 14px;
    }

    /* 关于我们版块 */
    .about-section {
      background-color: var(--secondary-color);
      padding: 40px 20px;
      margin: 50px 0;
      border-radius: 12px;
    }

    .about-title {
      font-size: 24px;
      font-weight: bold;
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 20px;
    }

    .about-content {
      max-width: 800px;
      margin: 0 auto;
      color: var(--text-color);
      line-height: 1.8;
      text-align: center;
    }

    /* 页脚信息 */
    footer {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 20px;
      text-align: center;
      margin-top: 50px;
    }

    .footer-text {
      color: var(--light-text);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- 头部：Logo + 副标题 + 用户头像 -->
  <header>
    <div class="header-left">
      <h1 class="site-logo">✨ 民大校园博客</h1>
      <p class="site-subtitle">记录民大生活 · 分享学习点滴 · 留下青春印记</p>
    </div>
    <div class="user-avatar">
      我
    </div>
  </header>

  <!-- 轮播图模块 -->
  <div class="carousel">
    <img src="https://picsum.photos/1200/400?random=1" alt="校园活动轮播图">
  </div>

  <!-- 博客内容区 -->
  <div class="container">
    <!-- 文章卡片1 -->
    <div class="card">
      <img class="card-cover" src="https://picsum.photos/800/400?random=2" alt="文章封面">
      <div class="card-content">
        <h3 class="card-title">民大校园生活分享</h3>
        <p class="card-excerpt">记录在图书馆泡馆的日子，分享高效复习方法和心态调整技巧...</p>
        <div class="card-meta">
          <span>发布时间：2026-05-06</span>
          <span>作者：NiuYimin</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 关于我们版块 -->
  <div class="about-section">
    <h2 class="about-title">关于我们</h2>
    <div class="about-content">
      <p>我们是民大软件工程专业的学生，这个博客是我们的课程项目之一。</p>
      <p>我们希望通过这个平台，分享校园生活、学习心得和技术成长。</p>
    </div>
  </div>

  <!-- 页脚信息 -->
  <footer>
    <p class="footer-text">© 2026 民大校园博客 | All Rights Reserved</p>
    <p class="footer-text"> Powered by Halo | 民大红色主题 v1.0</p>
  </footer>
</body>
</html>
