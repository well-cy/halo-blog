<script>
// ========== 搜索功能 ==========
window.addEventListener('load', function(){
  const searchInput = document.querySelector('input[placeholder="搜索文章..."]');
  const modal = document.getElementById('search-modal');
  const list = document.getElementById('search-results-list');

  if(!searchInput){
    console.error('未找到搜索框，请检查页面元素');
    return;
  }

  searchInput.onkeydown = null;
  searchInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      const kw = this.value.trim().toLowerCase();
      if(!kw){
        modal.style.display = 'none';
        return;
      }
      const links = Array.from(document.querySelectorAll('a'))
        .filter(a => a.href.includes('/archives/') && a.innerText.trim());
      const results = links
        .filter(a => a.innerText.toLowerCase().includes(kw))
        .map(a => ({ title: a.innerText.trim(), url: a.href }));

      if(results.length === 0){
        list.innerHTML = '<div class="search-empty-tip">暂无结果</div>';
      } else {
        const oneRes = results[0];
        list.innerHTML = '<div class="search-result-card"><a href="' + oneRes.url + '" target="_blank">' + oneRes.title + '</a></div>';
      }
      modal.style.display = 'block';
    }
  });

  document.addEventListener('click', function(e){
    if(!searchInput.contains(e.target) && !modal.contains(e.target)){
      modal.style.display = 'none';
    }
  });
});

// ========== AI摘要 ==========
async function generateAISummary(content) {
  const API_KEY = 'sk-838ca294a7644336961604339f57c63a';
  const prompt = '请用不超过100字提炼以下文章的核心观点，生成一段简洁流畅的摘要：\n\n' + content;
  const controller = new AbortController();
  const timeoutId = setTimeout(function(){ controller.abort(); }, 10000);
  try {
    const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+API_KEY },
      body: JSON.stringify({ model:'deepseek-chat', messages:[{role:'user',content:prompt}] }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if(!res.ok) throw new Error('API请求失败');
    const data = await res.json();
    return data.choices?.[0]?.message?.content || '摘要生成失败';
  } catch(e){
    clearTimeout(timeoutId);
    console.error('AI摘要生成失败:', e);
    return e.name === 'AbortError' ? '请求超时，请稍后再试' : '摘要生成失败';
  }
}

const categoryDescriptions = {
  '活动资讯':'活动资讯 | 校园活动、讲座通知、赛事动态一手掌握。',
  '日常生活':'日常生活 | 记录大学生活点滴、学习心得与生活感悟。',
  '社团动态':'社团动态 | 各大社团招新、活动分享与成长故事。',
  '学习笔记':'学习笔记 | 干货分享、期末复习、考证经验、学习方法。',
  '校园新闻':'校园新闻 | 校园大事、通知公告、校园热点全收录。'
};
function updateCategoryIntroByURL() {
  const introBox = document.getElementById('categoryIntro');
  if(!introBox) return;
  const url = window.location.href;
  var currentCat = '';
  if(url.includes('/categories/ri-chang-sheng-huo')) currentCat = '日常生活';
  else if(url.includes('/categories/huo-dong-zi-xun')) currentCat = '活动资讯';
  else if(url.includes('/categories/she-tuan-dong-tai')) currentCat = '社团动态';
  else if(url.includes('/categories/xue-xi-bi-ji')) currentCat = '学习笔记';
  else if(url.includes('/categories/xiao-yuan-xin-wen')) currentCat = '校园新闻';
  else if(url.includes('/categories/mo-ren-fen-lei')) currentCat = '默认分类';
  else {
    introBox.textContent = '这里是分类介绍文字，展示当前分类下的文章内容说明～';
    return;
  }
  introBox.textContent = categoryDescriptions[currentCat] || '这里是' + currentCat + '分类，分享相关文章内容。';
}
document.addEventListener('DOMContentLoaded', updateCategoryIntroByURL);

// ========== 彩色分类标签 ==========
document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    var cards = document.querySelectorAll('.post-card, .article-item, div[class*="col"]');
    var categories = ['活动资讯','日常生活','社团动态','学习笔记','校园新闻','默认分类'];
    cards.forEach(function(card){
      var walker = document.createTreeWalker(card, NodeFilter.SHOW_TEXT);
      var node;
      while(node = walker.nextNode()){
        var text = node.textContent.trim();
        if(categories.indexOf(text) !== -1){
          var badge = document.createElement('span');
          badge.className = 'cat-badge ' + text;
          badge.textContent = text;
          node.parentNode.replaceChild(badge, node);
          break;
        }
      }
    });
  }, 2000);
});

// ========== 阅读时间 ==========
document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    var WORDS_PER_MINUTE = 300;
    var allCards = document.querySelectorAll('.post-card, .article-item, div[class*="col"]');
    allCards.forEach(function(card){
      if(card.querySelector('.read-time-badge')) return;
      var fullText = card.textContent.trim();
      if(fullText.length < 10) return;
      
      var cleanText = fullText
        .replace(/发布于|20\d{2}-\d{2}-\d{2}|[a-zA-Z0-9@]+/g, '')
        .replace(/\s+/g, '');
      
      var charCount = cleanText.length;
      var timeLabel;
      
      if (charCount < 150) {
        timeLabel = '30秒';
      } else if (charCount < 200) {
        timeLabel = '1分钟以内';
      } else if (charCount >= 3000) {
        timeLabel = '10+分钟';
      } else {
        var minutes = Math.ceil(charCount / WORDS_PER_MINUTE);
        timeLabel = minutes + '分钟';
      }
      
      var badge = document.createElement('div');
      badge.className = 'read-time-badge';
      badge.textContent = timeLabel;
      card.appendChild(badge);
    });
  }, 1000);
});

// ========== 收藏系统（金色版） ==========
function getFavorites() {
  return JSON.parse(localStorage.getItem('my_collections') || '[]');
}
function saveFavorites(list) {
  localStorage.setItem('my_collections', JSON.stringify(list));
}
function toggleFavorite(title, url) {
  var favs = getFavorites();
  var idx = -1;
  for(var i=0; i<favs.length; i++){
    if(favs[i].url === url){ idx = i; break; }
  }
  if(idx !== -1){
    favs.splice(idx, 1);
  } else {
    var now = new Date();
    var dateStr = now.getFullYear() + '-' + 
      String(now.getMonth() + 1).padStart(2, '0') + '-' + 
      String(now.getDate()).padStart(2, '0') + ' ' +
      String(now.getHours()).padStart(2, '0') + ':' + 
      String(now.getMinutes()).padStart(2, '0');
    favs.push({ title: title, url: url, date: dateStr });
  }
  saveFavorites(favs);
  return idx === -1;
}

function showCampusCollections() {
  var cols = getFavorites();
  var list = document.getElementById('campus-col-list');
  if (cols.length === 0) {
    list.innerHTML = '<p style="color:#999;text-align:center;padding:30px 0;">还没有收藏任何文章～去文章页面点收藏吧！</p>';
  } else {
    list.innerHTML = cols.map(function(c, i) {
      return '<div class="campus-col-item">' +
        '<a href="' + c.url + '">' + c.title + '</a>' +
        '<br><small style="color:#999;">' + c.date + '</small>' +
        '<button class="campus-col-del" onclick="delCampusCol(' + i + ')">删除</button>' +
        '</div>';
    }).join('');
  }
  document.getElementById('campus-collect-overlay').style.display = 'block';
}
function delCampusCol(index) {
  var cols = getFavorites();
  cols.splice(index, 1);
  saveFavorites(cols);
  showCampusCollections();
}

// ========== 强制隐藏单独点赞按钮（JS层） ==========
function forceHideExtraButton(){
  var articleMain = document.querySelector('#content, div.article-content, div.post-content, article');
  if(!articleMain || !articleMain.parentNode) return;
  
  var nextEl = articleMain.nextElementSibling;
  while(nextEl){
    if(nextEl.id === 'customActionSection' || (nextEl.classList && nextEl.classList.contains('article-action-section'))){
      nextEl = nextEl.nextElementSibling;
      continue;
    }
    
    var cls = (nextEl.className || '').toString().toLowerCase();
    var html = (nextEl.innerHTML || '').toLowerCase();
    
    if((cls.includes('post-action') || cls.includes('like') || html.includes('i-tabler-heart') || html.includes('heart')) && !html.includes('comment') && !html.includes('collect')){
      nextEl.style.setProperty('display', 'none', 'important');
      nextEl.style.setProperty('visibility', 'hidden', 'important');
      nextEl.style.setProperty('height', '0', 'important');
      nextEl.style.setProperty('width', '0', 'important');
      nextEl.style.setProperty('overflow', 'hidden', 'important');
      nextEl.style.setProperty('opacity', '0', 'important');
      nextEl.style.setProperty('position', 'absolute', 'important');
      nextEl.style.setProperty('top', '-9999px', 'important');
      nextEl = nextEl.nextElementSibling;
    } else {
      break;
    }
  }
}

// ========== 文章详情页点赞收藏 ==========
function initArticleActionSection(articleMain) {
  if(!articleMain || document.querySelector('.article-action-section')) return;
  
  var actionSection = document.createElement('div');
  actionSection.className = 'article-action-section';
  actionSection.id = 'customActionSection';
  actionSection.innerHTML = '<button type="button" class="action-button like-button" id="likeButton"><span class="action-icon">♡</span><span class="action-text">点赞</span><span class="action-count" id="likeCount">0</span></button><button type="button" class="action-button collect-button" id="collectButton"><span class="action-icon">☆</span><span class="action-text">收藏</span><span class="action-count" id="collectCount">0</span></button>';
  var insertTarget = articleMain.parentNode;
  if(insertTarget) insertTarget.insertBefore(actionSection, articleMain.nextSibling);
  setupArticleActionButtons();
  forceHideExtraButton();
}

function setupArticleActionButtons(retryCount) {
  retryCount = retryCount || 0;
  var likeButton = document.getElementById('likeButton');
  var collectButton = document.getElementById('collectButton');
  if(!likeButton || !collectButton) return;
  var likeCountEl = document.getElementById('likeCount');
  var collectCountEl = document.getElementById('collectCount');
  var likeIcon = likeButton.querySelector('.action-icon');
  var collectIcon = collectButton.querySelector('.action-icon');
  var topUpvoteCountEl = document.querySelector('[data-upvote-post-name]');
  var topUpvoteBtn = topUpvoteCountEl ? topUpvoteCountEl.closest('.cursor-pointer') : null;
  if(!topUpvoteCountEl && retryCount < 15){
    setTimeout(function(){ setupArticleActionButtons(retryCount+1); }, 200);
    return;
  }
  if(likeButton.dataset.bound === 'true') return;
  likeButton.dataset.bound = 'true';
  collectButton.dataset.bound = 'true';
  var articleId = location.pathname;
  var collectStatusMap = JSON.parse(localStorage.getItem('articleCollectStatus') || '{}');
  var collectCountsMap = JSON.parse(localStorage.getItem('articleCollectCounts') || '{}');
  var isCollected = !!collectStatusMap[articleId];
  var collectCountVal = collectCountsMap[articleId] || 0;

  function isTopUpvoted(){
    if(!topUpvoteBtn) return false;
    var filledHeart = topUpvoteBtn.querySelector('.i-tabler-heart-filled');
    return filledHeart ? window.getComputedStyle(filledHeart).display !== 'none' : false;
  }
  function syncLikeFromTop(){
    if(topUpvoteCountEl) likeCountEl.textContent = topUpvoteCountEl.textContent.trim() || '0';
    var liked = isTopUpvoted();
    likeIcon.textContent = liked ? '♥' : '♡';
    likeButton.classList.toggle('liked', liked);
  }
  function updateCollectUI(){
    collectCountEl.textContent = collectCountVal;
    collectIcon.textContent = isCollected ? '★' : '☆';
    collectButton.classList.toggle('collected', isCollected);
  }
  syncLikeFromTop();
  updateCollectUI();
  if(topUpvoteCountEl){
    new MutationObserver(syncLikeFromTop).observe(topUpvoteCountEl, {childList:true,characterData:true,subtree:true});
  }
  likeButton.addEventListener('click', function(){
    if(topUpvoteBtn){
      topUpvoteBtn.click();
      likeButton.classList.add('bouncing');
      setTimeout(function(){ likeButton.classList.remove('bouncing'); syncLikeFromTop(); }, 300);
    }
  });
  collectButton.addEventListener('click', function(){
    isCollected = !isCollected;
    collectCountVal += isCollected ? 1 : -1;
    if(collectCountVal < 0) collectCountVal = 0;
    collectStatusMap[articleId] = isCollected;
    collectCountsMap[articleId] = collectCountVal;
    localStorage.setItem('articleCollectStatus', JSON.stringify(collectStatusMap));
    localStorage.setItem('articleCollectCounts', JSON.stringify(collectCountsMap));
    updateCollectUI();
    var title = document.title || location.pathname;
    if(isCollected){
      toggleFavorite(title, location.href);
    } else {
      var favs = getFavorites();
      favs = favs.filter(function(f){ return f.url !== location.href; });
      saveFavorites(favs);
    }
  });
}

// ========== 文章详情页右侧目录 ==========
function createArticleToc(articleTitle, aiCard, articleMain) {
  var oldToc = document.getElementById('articleToc');
  if(oldToc) oldToc.remove();
  
  var items = [];
  
  var titleEl = articleTitle || document.querySelector('h1.post-title, h1.article-title, .post-header h1, h1');
  var titleId = 'article-title-wrap';
  if(titleEl){
    if(!titleEl.id){ titleEl.id = titleId; }
    else { titleId = titleEl.id; }
  }
  items.push({ id: titleId, text: '📝 文章标题', el: titleEl });
  
  if(aiCard){
    var aiId = aiCard.id || 'ai-summary-card';
    if(!aiCard.id) aiCard.id = aiId;
    items.push({ id: aiId, text: '🤖 AI摘要', el: aiCard });
  }
  
  if(articleMain){
    var contentId = articleMain.id || 'article-content-wrap';
    if(!articleMain.id) articleMain.id = contentId;
    items.push({ id: contentId, text: '📄 文章内容', el: articleMain });
    
    var headings = articleMain.querySelectorAll('h2, h3');
    headings.forEach(function(h, i){
      var id = h.id || ('toc-h-' + i);
      if(!h.id) h.id = id;
      var prefix = h.tagName === 'H2' ? '▸ ' : '  ▪ ';
      items.push({ id: id, text: prefix + h.textContent.trim(), el: h });
    });
  }
  
  if(items.length === 0) return;
  
  var toc = document.createElement('nav');
  toc.className = 'article-toc show';
  toc.id = 'articleToc';
  
  var html = '<div class="toc-title">📑 文章目录</div><ul class="toc-list">';
  items.forEach(function(item){
    html += '<li class="toc-item"><a href="#' + item.id + '" class="toc-link">' + item.text + '</a></li>';
  });
  html += '</ul>';
  toc.innerHTML = html;
  document.body.appendChild(toc);
  
  toc.querySelectorAll('.toc-link').forEach(function(link){
    link.addEventListener('click', function(e){
      e.preventDefault();
      var targetId = this.getAttribute('href').substring(1);
      var target = document.getElementById(targetId);
      if(target){
        var top = target.getBoundingClientRect().top + window.pageYOffset - 80;
        window.scrollTo({ top: top, behavior: 'smooth' });
      }
    });
  });
  
  var tocItems = toc.querySelectorAll('.toc-item');
  window.addEventListener('scroll', function(){
    var scrollY = window.pageYOffset;
    var currentId = '';
    for(var i = items.length - 1; i >= 0; i--){
      var el = document.getElementById(items[i].id);
      if(el && scrollY >= el.offsetTop - 100){
        currentId = items[i].id;
        break;
      }
    }
    tocItems.forEach(function(ti){
      var href = ti.querySelector('.toc-link').getAttribute('href').substring(1);
      ti.classList.toggle('active', href === currentId);
    });
  });
}

// ========== 文章详情页初始化 ==========
document.addEventListener('DOMContentLoaded', function(){
  var isPostPage = location.pathname.startsWith('/archives/');
  
  addFavoritesNavButton();
  
  if(isPostPage){
    var progressContainer = document.createElement('div');
    progressContainer.className = 'reading-progress-container';
    progressContainer.innerHTML = '<div class="reading-progress-bar" id="readingProgressBar"></div>';
    document.body.prepend(progressContainer);
    
    var articleTitle = document.querySelector('h1.post-title, h1.article-title, .post-header h1');
    var articleMain = document.querySelector('#content, div.article-content, div.post-content, article');
    if(articleTitle) articleTitle.id = "article-title-wrap";
    if(articleMain) articleMain.id = "article-content-wrap";

    // AI摘要
    setTimeout(async function(){
      var existingAICard = document.querySelector('.ai-summary-card');
      if(existingAICard){
        if(!existingAICard.id) existingAICard.id = 'ai-summary-card';
        var articleContent = articleMain ? articleMain.innerText.replace(/\s+/g, ' ').trim() : '';
        var textEl = existingAICard.querySelector('.ai-summary-text');
        if(textEl) textEl.textContent = '正在生成摘要...';
        if(articleContent.length > 0){
          var summary = await generateAISummary(articleContent);
          if(textEl) textEl.textContent = summary;
        } else {
          if(textEl) textEl.textContent = "暂无内容摘要";
        }
      }
    }, 500);

    // 右侧目录
    setTimeout(function(){
      var aiCard = document.querySelector('.ai-summary-card');
      createArticleToc(articleTitle, aiCard, articleMain);
    }, 400);

    // 点赞收藏
    initArticleActionSection(articleMain);
    
    // 持续强制隐藏多余按钮
    setInterval(forceHideExtraButton, 200);

    // 阅读进度
    window.addEventListener('scroll', function(){
      var bar = document.getElementById('readingProgressBar');
      if(!bar) return;
      var top = window.pageYOffset || document.documentElement.scrollTop;
      var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      bar.style.width = height > 0 ? (top / height * 100) + '%' : '0%';
    });
  }
});
