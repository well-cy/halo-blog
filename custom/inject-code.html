<script>
// 点赞收藏
function copyLink(){}
function likePost(){alert("点赞成功！")}
function collectPost(){alert("收藏成功！")}

// ========== 你的真实文章：标题 + slug别名（改成你自己真实文章）==========
const mockArticles = [
  { title: "运动会精彩瞬间回顾", slug: "sports-meet", content: "本次运动会有短跑、跳远、接力赛等项目。" },
  { title: "校园篮球赛决赛", slug: "basketball-final", content: "校队在决赛中以2分险胜夺冠。" },
  { title: "期末复习指南", slug: "exam-review", content: "各科复习重点和时间规划建议。" }
];

document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('halo-search-input');
  const searchModal = document.getElementById('search-modal');
  const resultsList = document.getElementById('search-results-list');

  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const keyword = this.value.trim();
      resultsList.innerHTML = '';
      if(!keyword){searchModal.style.display='none';return;}
      const res = mockArticles.filter(x=>x.title.includes(keyword)||x.content.includes(keyword));
      
      if(res.length===0){
        resultsList.innerHTML = `<div class="search-empty-tip"><h4>😶‍🌫️ 暂无搜索结果</h4><p>换个关键词试试吧～</p></div>`;
      }else{
        res.forEach(art=>{
          let t = art.title.replace(new RegExp(keyword,'g'),`<span class="highlighted">${keyword}</span>`);
          let c = art.content.replace(new RegExp(keyword,'g'),`<span class="highlighted">${keyword}</span>`);
          // 关键：加a标签 → Halo真实文章链接 /archives/xxx
          resultsList.innerHTML += `
            <div class="search-result-card">
              <h4><a href="/archives/${art.slug}" target="_blank">${t}</a> <span class="read-time-label">阅读约1分钟</span></h4>
              <p>${c}</p>
            </div>
          `;
        });
      }
      searchModal.style.display = 'block';
    }
  });

  document.addEventListener('click',e=>{
    if(!searchInput.contains(e.target)&&!searchModal.contains(e.target)){
      searchModal.style.display='none';
    }
  });
});
</script>
