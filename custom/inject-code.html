<div class="search-box">

<script>
// 夜间模式
if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
}

// 搜索功能
function initSearch() {
  const input = document.getElementById('halo-search-input');
  const modal = document.getElementById('search-modal');
  const list = document.getElementById('search-results-list');
  if (!input) return;
  
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const kw = input.value.trim().toLowerCase();
      if (!kw) {
        modal.style.display = 'none';
        return;
      }
      const results = [];
      document.querySelectorAll('a').forEach(link => {
        if (link.href && link.href.includes('/archives/') && link.innerText.toLowerCase().includes(kw)) {
          results.push({ title: link.innerText, url: link.href });
        }
      });
      list.innerHTML = results.length === 0
        ? '<div class="search-empty-tip"><h4>暂无结果</h4></div>'
        : results.map(function(item) {
            return '<div class="search-result-card"><h4><a href="' + item.url + '" target="_blank">' + item.title + '</a></h4></div>';
          }).join('');
      modal.style.display = 'block';
    }
  });
  
  document.addEventListener('click', function(e) {
    if (input && modal && !input.contains(e.target) && !modal.contains(e.target)) {
      modal.style.display = 'none';
    }
  });
}

// 阅读时间标签
function initReadTime() {
  setTimeout(function() {
    document.querySelectorAll('.post-card, .article-item').forEach(function(card) {
      if (card.querySelector('.read-time-badge')) return;
      var t = card.textContent.trim();
      if (t.length < 50) return;
      var min = Math.max(1, Math.ceil(t.length / 400));
      var badge = document.createElement('div');
      badge.className = 'read-time-badge';
      badge.textContent = min + ' 分钟';
      card.style.position = 'relative';
      card.appendChild(badge);
    });
  }, 1000);
}

// 彩色分类标签
function initColorTags() {
  setTimeout(function() {
    var cats = ['活动资讯', '日常生活', '社团动态', '学习笔记', '校园新闻', '默认分类'];
    document.querySelectorAll('.post-card, .article-item').forEach(function(card) {
      var walker = document.createTreeWalker(card, NodeFilter.SHOW_TEXT);
      var node;
      while (node = walker.nextNode()) {
        var text = node.textContent.trim();
        if (cats.includes(text)) {
          var span = document.createElement('span');
          span.className = 'cat-badge ' + text;
          span.textContent = text;
          node.parentNode.replaceChild(span, node);
          break;
        }
      }
    });
  }, 2000);
}

// 文章页功能
function initPostFeatures() {
  var isPost = location.pathname.startsWith('/archives/');
  if (!isPost) return;

  // 进度条
  var progressContainer = document.createElement('div');
  progressContainer.className = 'reading-progress-container';
  progressContainer.innerHTML = '<div class="reading-progress-bar" id="readingProgressBar"></div>';
  document.body.prepend(progressContainer);
  
  window.addEventListener('scroll', function() {
    var bar = document.getElementById('readingProgressBar');
    if (!bar) return;
    var top = window.pageYOffset;
    var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    bar.style.width = height > 0 ? (top / height) * 100 + '%' : '0%';
  });

  // AI摘要
  var aiCard = document.createElement('div');
  aiCard.className = 'ai-summary-card';
  aiCard.innerHTML = '<div class="ai-summary-left-bar"></div><div class="ai-summary-content"><div class="ai-summary-label">🤖 AI 摘要</div><p class="ai-summary-text">本文为校园生活分享内容，欢迎阅读～</p></div>';
  var article = document.querySelector('article, .post-content, .article-content');
  if (article) article.before(aiCard);

  // 目录导航
  var toc = document.createElement('nav');
  toc.className = 'article-toc';
  toc.innerHTML = '<div class="toc-title">📖 文章目录</div><ul class="toc-list"><li class="toc-item active"><a class="toc-link" href="#">文章标题</a></li><li class="toc-item"><a class="toc-link" href="#">正文内容</a></li></ul>';
  document.body.appendChild(toc);

  // 点赞收藏按钮
  var actions = document.createElement('div');
  actions.className = 'post-actions';
  actions.innerHTML = '<button class="like-btn" onclick="alert(\'❤️ 感谢点赞！\')">👍 点赞</button><button class="collect-btn" onclick="alert(\"⭐ 收藏成功！可在个人中心查看\")">🔖 收藏</button>';
  var comment = document.querySelector('#comment');
  if (comment) comment.before(actions);

  // 底部点赞区域
  var likeSection = document.createElement('div');
  likeSection.className = 'article-like-section';
  likeSection.innerHTML = '<button class="like-button" id="likeButton"><span class="like-icon">♡</span><span>点赞</span><span class="like-count">0</span></button>';
  if (article) article.after(likeSection);
  
  var likeBtn = document.getElementById('likeButton');
  if (likeBtn) {
    var count = 0;
    var liked = false;
    likeBtn.addEventListener('click', function() {
      liked = !liked;
      count += liked ? 1 : -1;
      likeBtn.classList.toggle('liked', liked);
      likeBtn.querySelector('.like-icon').textContent = liked ? '♥' : '♡';
      likeBtn.querySelector('.like-count').textContent = count;
    });
  }
}

// 修改标题和页脚
function initThemeText() {
  var logo = document.querySelector('.logo a');
  if (logo && logo.innerText !== '民大校园博客') logo.innerText = '民大校园博客';
  
  var subtitle = document.querySelector('.subtitle');
  if (subtitle && subtitle.innerText !== '记录校园生活 · 分享青春故事 · 凝聚民大力量') {
    subtitle.innerText = '记录校园生活 · 分享青春故事 · 凝聚民大力量';
  }
}

// 替换登录页Logo
function initLoginLogo() {
  var imgs = document.querySelectorAll('img[src*="halo"], img[alt*="Halo"], img[alt*="halo"]');
  imgs.forEach(function(img) {
    img.style.display = 'none';
  });
  
  if (document.title && document.title.includes('Halo')) {
    document.title = '民大校园生活圈 - 登录';
  }
}

// 关于我们版块
function initAboutSection() {
  var aboutHTML = '<div class="about-section" style="background:#fceee6;padding:20px;margin:20px 0;border-radius:12px;"><h2 style="color:#c45428;">🏫 关于我们</h2><p>民大校园生活圈是一个专注于校园生活、学习分享、活动记录的开放式平台。我们致力于打造温暖、真实、有价值的校园内容社区，让每一位同学都能在这里记录成长、分享热爱、收获共鸣。</p></div>';
  
  var containers = ['.content-wrap', '.post-list', '.article-list', '.container', 'main', '#main'];
  for (var i = 0; i < containers.length; i++) {
    var container = document.querySelector(containers[i]);
    if (container) {
      container.insertAdjacentHTML('beforebegin', aboutHTML);
      break;
    }
  }
}

// 分享链接功能
window.copyLink = function() {
  navigator.clipboard.writeText(window.location.href).then(function() {
    alert('🔗 链接已复制！');
  });
};

// 页面加载完成后执行所有初始化
document.addEventListener('DOMContentLoaded', function() {
  initSearch();
  initReadTime();
  initColorTags();
  initPostFeatures();
  initThemeText();
  initLoginLogo();
  initAboutSection();
  
  // 强制隐藏分类介绍文字（任务2）
  var categoryIntro = document.getElementById('categoryIntro');
  if (categoryIntro) {
    categoryIntro.style.display = 'none';
  }
});
</script>
