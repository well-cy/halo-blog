<script>
// AI摘要接口函数（增加超时和错误处理）
async function generateAISummary(content) {
  const API_KEY = 'sk-838ca294a7644336961604339f57c63a';
  const prompt = `请用不超过100字提炼以下文章的核心观点，生成一段简洁流畅的摘要：\n\n${content}`;
  
  // 增加超时处理
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 10000); // 10秒超时

  try {
    const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type':'application/json',
        'Authorization':'Bearer '+API_KEY
      },
      body: JSON.stringify({
        model:'deepseek-chat',
        messages:[{role:'user',content:prompt}]
      }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    
    if (!res.ok) throw new Error('API请求失败');
    const data = await res.json();
    return data.choices?.[0]?.message?.content || '摘要生成失败';
  } catch(e){
    clearTimeout(timeoutId);
    console.error('AI摘要生成失败:', e);
    if (e.name === 'AbortError') return '请求超时，请稍后再试';
    return '摘要生成失败';
  }
}

// 1. 每个分类的专属介绍文案
const categoryDescriptions = {
  '活动资讯': '活动资讯 | 校园活动、讲座通知、赛事动态一手掌握。',
  '日常生活': '日常生活 | 记录大学生活点滴、学习心得与生活感悟。',
  '社团动态': '社团动态 | 各大社团招新、活动分享与成长故事。',
  '学习笔记': '学习笔记 | 干货分享、期末复习、考证经验、学习方法。',
  '校园新闻': '校园新闻 | 校园大事、通知公告、校园热点全收录。'
};

// 2. 通过URL判断当前分类
function updateCategoryIntroByURL() {
  const introBox = document.getElementById('categoryIntro');
  if (!introBox) return;

  const url = window.location.href;
  let currentCat = '';

  if (url.includes('/categories/ri-chang-sheng-huo')) currentCat = '日常生活';
  else if (url.includes('/categories/huo-dong-zi-xun')) currentCat = '活动资讯';
  else if (url.includes('/categories/she-tuan-dong-tai')) currentCat = '社团动态';
  else if (url.includes('/categories/xue-xi-bi-ji')) currentCat = '学习笔记';
  else if (url.includes('/categories/xiao-yuan-xin-wen')) currentCat = '校园新闻';
  else if (url.includes('/categories/mo-ren-fen-lei')) currentCat = '默认分类';
  else {
    introBox.textContent = '这里是分类介绍文字，展示当前分类下的文章内容说明～';
    return;
  }

  introBox.textContent = categoryDescriptions[currentCat] || `这里是${currentCat}分类，分享相关文章内容。`;
}

document.addEventListener('DOMContentLoaded', updateCategoryIntroByURL);

// 3. 强制给文章卡片的分类文字套上彩色标签
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(() => {
    const cards = document.querySelectorAll('.post-card, .article-item, div[class*="col"]');
    const categories = ['活动资讯','日常生活','社团动态','学习笔记','校园新闻','默认分类'];

    cards.forEach(card => {
      const walker = document.createTreeWalker(card, NodeFilter.SHOW_TEXT);
      let node;
      while(node = walker.nextNode()) {
        const text = node.textContent.trim();
        if(categories.includes(text)) {
          const badge = document.createElement('span');
          badge.className = `cat-badge ${text}`;
          badge.textContent = text;
          node.parentNode.replaceChild(badge, node);
          break;
        }
      }
    });
  }, 2000);
});

// 4. 搜索功能
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('halo-search-input');
  const searchModal = document.getElementById('search-modal');
  const resultsList = document.getElementById('search-results-list');

  function searchArticle(keyword) {
    keyword = keyword.trim().toLowerCase();
    if (!keyword) {
      searchModal.style.display = 'none';
      return;
    }

    let results = [];
    let allLinks = document.querySelectorAll('a');

    allLinks.forEach(link => {
      let text = link.innerText.toLowerCase();
      let href = link.href;
      if (href.includes('/archives/') && text.includes(keyword)) {
        results.push({ title: link.innerText, url: href });
      }
    });

    resultsList.innerHTML = '';
    if (results.length === 0) {
      resultsList.innerHTML = `<div class="search-empty-tip"><h4>😶‍🌫️ 暂无结果</h4></div>`;
    } else {
      results.forEach(item => {
        resultsList.innerHTML += `
          <div class="search-result-card">
            <h4><a href="${item.url}" target="_blank">${item.title}</a></h4>
          </div>`;
      });
    }
    searchModal.style.display = 'block';
  }

  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') searchArticle(this.value);
  });

  document.addEventListener('click', function(e) {
    if (!searchInput.contains(e.target) && !searchModal.contains(e.target)) {
      searchModal.style.display = 'none';
    }
  });
});

// 5. 阅读时间功能
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(() => {
    const WORDS_PER_MINUTE = 400;
    const allCards = document.querySelectorAll('.post-card, .article-item, div[class*="col"]');

    allCards.forEach(card => {
      if (card.querySelector('.read-time-badge')) return;
      const fullText = card.textContent.trim();
      if (fullText.length < 10) return;
      const cleanText = fullText.replace(/发布于|20\d{2}-\d{2}-\d{2}|[a-zA-Z0-9@]+/g, '');
      const wordCount = cleanText.length;
      const readTime = Math.max(1, Math.ceil(wordCount / WORDS_PER_MINUTE));

      const badge = document.createElement('div');
      badge.className = 'read-time-badge';
      badge.textContent = `${readTime} 分钟`;
      card.appendChild(badge);
    });
  }, 1000);
});

document.addEventListener('DOMContentLoaded', function() {
  const isPostPage = window.location.pathname.startsWith('/archives/');
  if (isPostPage) {
    const progressContainer = document.createElement('div');
    progressContainer.className = 'reading-progress-container';
    progressContainer.innerHTML = '<div class="reading-progress-bar" id="readingProgressBar"></div>';
    document.body.prepend(progressContainer);

    const articleTitle = document.querySelector('h1.post-title, h1.article-title, .post-header h1');
    const articleMain = document.querySelector('div.article-content, div.post-content, article');
    if(articleTitle) articleTitle.id = "article-title-wrap";
    if(articleMain) articleMain.id = "article-content-wrap";

    // 关键修改：复用已有的AI摘要卡片，不新增
    setTimeout(async () => {
      // 找到已有的AI摘要卡片（只取第一个）
      const existingAICard = document.querySelector('.ai-summary-card');
      if (existingAICard) {
        const articleContent = articleMain ? articleMain.innerText.replace(/\s+/g, ' ').trim() : '';
        const textEl = existingAICard.querySelector('.ai-summary-text');
        
        // 先显示加载状态
        if (textEl) textEl.textContent = '正在生成摘要...';

        if (articleContent.length > 0) {
          const summary = await generateAISummary(articleContent);
          if (textEl) textEl.textContent = summary;
        } else {
          if (textEl) textEl.textContent = "暂无内容摘要";
        }
      }
    }, 500);

    const toc = document.createElement('nav');
    toc.className = 'article-toc';
    toc.id = 'articleToc';
    toc.innerHTML = `
      <div class="toc-title">文章目录</div>
      <ul class="toc-list">
        <li class="toc-item active"><a href="#article-title-wrap" class="toc-link">文章标题</a></li>
        <li class="toc-item"><a href="#article-content-wrap" class="toc-link">文章正文</a></li>
      </ul>
    `;
    document.body.appendChild(toc);

    // 新增点赞+收藏按钮区域
    const actionSection = document.createElement('div');
    actionSection.className = 'article-action-section';
    actionSection.innerHTML = `
      <button class="action-button like-button" id="likeButton">
        <span class="action-icon">♡</span>
        <span class="action-text">点赞</span>
        <span class="action-count" id="likeCount">0</span>
      </button>
      <button class="action-button collect-button" id="collectButton">
        <span class="action-icon">☆</span>
        <span class="action-text">收藏</span>
        <span class="action-count" id="collectCount">0</span>
      </button>
    `;
    if (articleMain) articleMain.after(actionSection);
  }

  // 点赞功能（同步到页面顶部）
  const likeButton = document.getElementById('likeButton');
  const collectButton = document.getElementById('collectButton');
  if (likeButton && collectButton) {
    const likeCount = document.getElementById('likeCount');
    const collectCount = document.getElementById('collectCount');
    const likeIcon = likeButton.querySelector('.action-icon');
    const collectIcon = collectButton.querySelector('.action-icon');

    // 从本地存储读取状态
    const articleId = location.pathname;
    if (!localStorage.getItem('articleLikes')) localStorage.setItem('articleLikes', '{}');
    if (!localStorage.getItem('articleCollects')) localStorage.setItem('articleCollects', '{}');
    const likes = JSON.parse(localStorage.getItem('articleLikes'));
    const collects = JSON.parse(localStorage.getItem('articleCollects'));
    let isLiked = !!likes[articleId];
    let likeCountVal = likes[articleId] || 0;
    let isCollected = !!collects[articleId];
    let collectCountVal = collects[articleId] || 0;

    // 页面顶部点赞元素
    const topLikeElement = document.querySelector('.post-header .like, .post-header [aria-label*="点赞"], .post-header [class*="like"]');

    function updateLikeUI() {
      likeCount.textContent = likeCountVal;
      likeIcon.textContent = isLiked ? '♥' : '♡';
      likeButton.classList.toggle('liked', isLiked);
      if (topLikeElement) {
        topLikeElement.textContent = likeCountVal;
        topLikeElement.classList.toggle('liked', isLiked);
      }
    }

    function updateCollectUI() {
      collectCount.textContent = collectCountVal;
      collectIcon.textContent = isCollected ? '★' : '☆';
      collectButton.classList.toggle('collected', isCollected);
    }

    // 初始化UI
    updateLikeUI();
    updateCollectUI();

    // 点赞事件
    likeButton.addEventListener('click', function() {
      isLiked = !isLiked;
      likeCountVal += isLiked ? 1 : -1;
      likes[articleId] = likeCountVal;
      localStorage.setItem('articleLikes', JSON.stringify(likes));
      likeButton.classList.add('bouncing');
      setTimeout(() => likeButton.classList.remove('bouncing'), 500);
      updateLikeUI();
    });

    // 收藏事件
    collectButton.addEventListener('click', function() {
      isCollected = !isCollected;
      collectCountVal += isCollected ? 1 : -1;
      collects[articleId] = collectCountVal;
      localStorage.setItem('articleCollects', JSON.stringify(collects));
      updateCollectUI();
    });
  }

  window.addEventListener('scroll', function() {
    const bar = document.getElementById('readingProgressBar');
    if (!bar) return;
    const top = window.pageYOffset || document.documentElement.scrollTop;
    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    const per = height > 0 ? (top / height) * 100 : 0;
    bar.style.width = per + '%';
  });

  setTimeout(() => {
    const tocLinks = document.querySelectorAll('.toc-link');
    const headerOffset = 80;
    tocLinks.forEach(link => {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        const targetId = this.getAttribute('href').substring(1);
        const targetElement = document.getElementById(targetId);
        if (targetElement) {
          const elementTop = targetElement.getBoundingClientRect().top + window.pageYOffset;
          window.scrollTo({
            top: elementTop - headerOffset,
            behavior: 'smooth'
          });
        }
      });
    });
  }, 100);

  window.addEventListener('scroll', function() {
    const sections = document.querySelectorAll('#article-title-wrap,#article-content-wrap');
    const items = document.querySelectorAll('.toc-item');
    const scrollY = window.pageYOffset;
    let curr = '';
    if (scrollY < 50) curr = 'article-title-wrap';
    else sections.forEach(s => { if (scrollY >= s.offsetTop - 100) curr = s.id; });
    items.forEach(i => {
      const href = i.querySelector('.toc-link')?.getAttribute('href')?.substring(1);
      i.classList.toggle('active', href === curr);
    });
  });
});
</script>
