<!-- 关键修改：把关于我们版块直接注入到文章列表上方 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const aboutHTML = `
    <div class="about-section">
      <h2>关于我们</h2>
      <p>民大校园博客是一个专注于校园生活、学习分享、活动记录的开放式平台。我们致力于打造温暖、真实、有价值的校园内容社区，让每一位同学都能在这里记录成长、分享热爱、收获共鸣。</p>
    </div>
  `;
  // 找到文章列表容器，把版块插入到它前面
  const articleContainer = document.querySelector('.content-wrap, .post-list, article-list, .container');
  if (articleContainer && articleContainer.previousElementSibling) {
    articleContainer.parentNode.insertBefore(document.createRange().createContextualFragment(aboutHTML), articleContainer);
  } else if (articleContainer) {
    articleContainer.insertAdjacentHTML('beforebegin', aboutHTML);
  }

  // 复制分享链接
  function copyLink() {
    navigator.clipboard.writeText(window.location.href).then(() => alert("链接已复制！"));
  }

  // 点赞功能
  function likePost() { alert("点赞成功！感谢支持～"); }

  // 收藏功能
  function collectPost() { alert("收藏成功！可在个人中心查看～"); }

  // 模拟文章数据（用于本地搜索）
  const mockArticles = [
    { title: "运动会精彩瞬间回顾", content: "本次运动会有短跑、跳远、接力赛等项目，同学们表现出色。" },
    { title: "校园篮球赛决赛", content: "校队在决赛中以2分险胜，夺得冠军。" },
    { title: "期末复习指南", content: "各科复习重点和时间规划建议，助你高效备考。" }
  ];

  // 文章页面自动插入点赞收藏按钮
  const path = window.location.pathname;
  if (path !== '/' && !path.includes('/category/') && !path.includes('/tag/')) {
    const actionDiv = document.createElement('div');
    actionDiv.className = 'post-actions';
    actionDiv.innerHTML = `
      <button class="like-btn" onclick="likePost()">❤️ 点赞</button>
      <button class="collect-btn" onclick="collectPost()">⭐ 收藏</button>
    `;
    const comment = document.querySelector('#comment');
    if (comment) comment.before(actionDiv);
  }

  // 修改副标题 + 页脚
  const logo = document.querySelector('.logo a');
  if (logo) logo.innerText = "民大校园博客";

  const subtitle = document.querySelector('.subtitle');
  if (subtitle) subtitle.innerText = "记录校园生活 · 分享青春故事 · 凝聚民大力量";

  const footer = document.querySelector('footer');
  if (footer) footer.innerText = "© 2026 民大校园博客 | 砖红色校园主题 · 用心打造每一处细节";
});
</script>
