<!-- 搜索框 -->
<div class="search-box">
  <span class="search-icon">🔍</span>
  <input type="text" class="search-input" id="halo-search-input" placeholder="搜索文章...">
</div>

<!-- 搜索弹窗 -->
<div id="search-modal">
  <h3>📑 搜索结果</h3>
  <div id="search-results-list"></div>
</div>

<button id="float-write-btn" onclick="window.open('/console/#/editor/posts', '_blank')">✏️</button>

<div id="top-notice-bar">
  📢 校园博客欢迎你！分享学习、生活、趣事都可以投稿～
  <span id="close-notice" onclick="document.getElementById('top-notice-bar').style.display='none'">×</span>
</div>

<script>
// 1. 搜索功能：移除阅读时间，只显示标题
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('halo-search-input');
  const searchModal = document.getElementById('search-modal');
  const resultsList = document.getElementById('search-results-list');

  function searchArticle(keyword) {
    keyword = keyword.trim().toLowerCase();
    if (!keyword) {
      searchModal.style.display = 'none';
      return;
    }

    let results = [];
    let allLinks = document.querySelectorAll('a');

    allLinks.forEach(link => {
      let text = link.innerText.toLowerCase();
      let href = link.href;
      if (href.includes('/archives/') && text.includes(keyword)) {
        results.push({ 
          title: link.innerText, 
          url: href
        });
      }
    });

    resultsList.innerHTML = '';
    if (results.length === 0) {
      resultsList.innerHTML = `<div class="search-empty-tip"><h4>😶‍🌫️ 暂无结果</h4></div>`;
    } else {
      results.forEach(item => {
        resultsList.innerHTML += `
          <div class="search-result-card">
            <h4><a href="${item.url}" target="_blank">${item.title}</a></h4>
          </div>`;
      });
    }
    searchModal.style.display = 'block';
  }

  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      searchArticle(this.value);
    }
  });

  document.addEventListener('click', function(e) {
    if (!searchInput.contains(e.target) && !searchModal.contains(e.target)) {
      searchModal.style.display = 'none';
    }
  });
});

// 2. 文章卡片右上角自动生成阅读时间（强制生效版）
document.addEventListener('DOMContentLoaded', function() {
  // 等待页面完全加载后执行（双重延迟，确保渲染完成）
  setTimeout(() => {
    // 阅读速度：按每分钟 400 字计算
    const WORDS_PER_MINUTE = 400;

    // 匹配所有文章卡片
    const allCards = document.querySelectorAll('.post-card, .article-item, div[class*="col"]');

    allCards.forEach(card => {
      // 跳过已经生成过阅读时间的卡片
      if (card.querySelector('.read-time-badge')) return;

      // 读取卡片内的文本（兜底方案）
      const fullText = card.textContent.trim();
      if (fullText.length < 10) return;

      // 过滤无关文本，计算阅读时间
      const cleanText = fullText.replace(/发布于|20\d{2}-\d{2}-\d{2}|[a-zA-Z0-9@]+/g, '');
      const wordCount = cleanText.length;
      const readTime = Math.max(1, Math.ceil(wordCount / WORDS_PER_MINUTE));

      // 生成阅读时间标签（右上角样式）
      const badge = document.createElement('div');
      badge.className = 'read-time-badge';
      badge.textContent = `${readTime} 分钟`;

      // 强制添加到卡片内
      card.appendChild(badge);
    });
  }, 1000); // 延迟 1 秒执行，确保页面完全加载
});

// 工具函数
function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(function() {
    alert('链接已复制！');
  });
}
function likePost() {
  alert("点赞成功！感谢支持～");

function collectPost() {
  alert("收藏成功！快去个人中心查看吧～");
}

document.addEventListener('DOMContentLoaded', function() {
  const isPostPage = window.location.pathname.startsWith('/archives/');
  if (isPostPage) {
    const progressContainer = document.createElement('div');
    progressContainer.className = 'reading-progress-container';
    progressContainer.innerHTML = '<div class="reading-progress-bar" id="readingProgressBar"></div>';
    document.body.prepend(progressContainer);

    const articleTitle = document.querySelector('h1.post-title, h1.article-title, .post-header h1');
    const articleMain = document.querySelector('div.article-content, div.post-content, article');
    if(articleTitle) articleTitle.id = "article-title-wrap";
    if(articleMain) articleMain.id = "article-content-wrap";

    const aiCard = document.createElement('div');
    aiCard.className = 'ai-summary-card';
    aiCard.id = 'ai-summary-wrap';
    aiCard.innerHTML = `
      <div class="ai-summary-left-bar"></div>
      <div class="ai-summary-content">
        <div class="ai-summary-label">AI 摘要</div>
        <p class="ai-summary-text">这是一段示例摘要内容，用于展示AI摘要卡片的效果。后续会接入真实的AI摘要生成功能。</p>
      </div>
    `;
    const article = document.querySelector('article, .post, .article-content');
    if (article) article.parentNode.insertBefore(aiCard, article);

    const toc = document.createElement('nav');
    toc.className = 'article-toc show';
    toc.id = 'articleToc';
    toc.innerHTML = `
      <div class="toc-title">文章目录</div>
      <ul class="toc-list">
        <li class="toc-item active"><a href="#article-title-wrap" class="toc-link">文章标题</a></li>
        <li class="toc-item"><a href="#ai-summary-wrap" class="toc-link">AI摘要</a></li>
        <li class="toc-item"><a href="#article-content-wrap" class="toc-link">文章正文</a></li>
      </ul>
    `;
    document.body.appendChild(toc);

    const likeSection = document.createElement('div');
    likeSection.className = 'article-like-section';
    likeSection.innerHTML = `
      <button class="like-button" id="likeButton">
        <span class="like-icon">♡</span>
        <span class="like-text">点赞</span>
        <span class="like-count" id="likeCount">0</span>
      </button>
    `;
    if (article) article.after(likeSection);
  }

  if (isPostPage) {
    const actionDiv = document.createElement('div');
    actionDiv.className = 'post-actions';
    actionDiv.innerHTML = `
      <button class="like-btn" onclick="likePost()">❤️ 点赞</button>
      <button class="collect-btn" onclick="collectPost()">⭐ 收藏</button>
    `;
    const comment = document.querySelector('#comment');
    if (comment) comment.before(actionDiv);
  }

  const likeButton = document.getElementById('likeButton');
  if (likeButton) {
    const likeCount = document.getElementById('likeCount');
    const likeIcon = likeButton.querySelector('.like-icon');
    let isLiked = false;
    let count = parseInt(likeCount.textContent) || 0;

    likeButton.addEventListener('click', function() {
      if (!isLiked) {
        isLiked = true;
        count++;
        likeButton.classList.add('liked');
        likeIcon.textContent = '♥';
        likeButton.classList.add('bouncing');
        setTimeout(() => likeButton.classList.remove('bouncing'), 500);
      } else {
        isLiked = false;
        count--;
        likeButton.classList.remove('liked');
        likeIcon.textContent = '♡';
      }
      likeCount.textContent = count;
    });
  }

  window.addEventListener('scroll', function() {
    const bar = document.getElementById('readingProgressBar');
    if (!bar) return;
    const top = window.pageYOffset || document.documentElement.scrollTop;
    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    const per = height > 0 ? (top / height) * 100 : 0;
    bar.style.width = per + '%';
  });

  setTimeout(() => {
    const tocLinks = document.querySelectorAll('.toc-link');
    const headerOffset = 80;
    tocLinks.forEach(link => {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        const targetId = this.getAttribute('href').substring(1);
        const targetElement = document.getElementById(targetId);
        if (targetElement) {
          const elementTop = targetElement.getBoundingClientRect().top + window.pageYOffset;
          window.scrollTo({
            top: elementTop - headerOffset,
            behavior: 'smooth'
          });
        }
      });
    });
  }, 100);

  window.addEventListener('scroll', function() {
    const sections = document.querySelectorAll('#article-title-wrap,#ai-summary-wrap,#article-content-wrap');
    const items = document.querySelectorAll('.toc-item');
    const scrollY = window.pageYOffset;
    let curr = '';
    if (scrollY < 50) {
      curr = 'article-title-wrap';
    } else {
      sections.forEach(s => {
        if (scrollY >= s.offsetTop - 100) curr = s.id;
      });
    }
    items.forEach(i => {
      const href = i.querySelector('.toc-link')?.getAttribute('href')?.substring(1);
      if (href === curr) i.classList.add('active');
      else i.classList.remove('active');
    });
  });
});
</script>
