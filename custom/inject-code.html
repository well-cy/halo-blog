<!-- 分类介绍 -->
<div class="category-intro" id="categoryIntro">加载中...</div>

<script>
// 分类介绍
const categoryDescriptions = {
  '活动资讯':'活动资讯 | 校园活动、讲座通知一手掌握。',
  '日常生活':'日常生活 | 记录大学生活点滴。',
  '社团动态':'社团动态 | 各大社团活动分享。',
  '学习笔记':'学习笔记 | 干货、复习、经验分享。',
  '校园新闻':'校园新闻 | 校园大事全收录。'
};
function updateCategoryIntroByURL(){
  const introBox = document.getElementById('categoryIntro');
  if(!introBox) return;
  const url = window.location.href;
  let cat = '';
  if(url.includes('/categories/huo-dong-zi-xun')) cat='活动资讯';
  else if(url.includes('/categories/ri-chang-sheng-huo')) cat='日常生活';
  else if(url.includes('/categories/she-tuan-dong-tai')) cat='社团动态';
  else if(url.includes('/categories/xue-xi-bi-ji')) cat='学习笔记';
  else if(url.includes('/categories/xiao-yuan-xin-wen')) cat='校园新闻';
  introBox.textContent = categoryDescriptions[cat] || '校园生活分享平台';
}
document.addEventListener('DOMContentLoaded',updateCategoryIntroByURL);

// 搜索
document.addEventListener('DOMContentLoaded',function(){
  const input = document.getElementById('halo-search-input');
  const modal = document.getElementById('search-modal');
  const list = document.getElementById('search-results-list');
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const kw = input.value.trim().toLowerCase();
      if(!kw){modal.style.display='none';return;}
      const results = [];
      document.querySelectorAll('a').forEach(link=>{
        if(link.href.includes('/archives/')&&link.innerText.toLowerCase().includes(kw)){
          results.push({title:link.innerText,url:link.href});
        }
      });
      list.innerHTML = results.length===0
        ? '<div class="search-empty-tip"><h4>暂无结果</h4></div>'
        : results.map(i=>`<div class="search-result-card"><h4><a href="${i.url}" target="_blank">${i.title}</a></h4></div>`).join('');
      modal.style.display='block';
    }
  });
  document.addEventListener('click',e=>{
    if(!input.contains(e.target)&&!modal.contains(e.target)) modal.style.display='none';
  });
});

// 阅读时间
document.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>{
    document.querySelectorAll('.post-card,.article-item').forEach(card=>{
      const t = card.textContent.trim();
      if(t.length<50) return;
      const min = Math.max(1,Math.ceil(t.length/400));
      const b = document.createElement('div');
      b.className='read-time-badge';
      b.textContent=min+' 分钟';
      card.appendChild(b);
    });
  },1000);
});

// 彩色标签
document.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>{
    const cats=['活动资讯','日常生活','社团动态','学习笔记','校园新闻','默认分类'];
    document.querySelectorAll('.post-card,.article-item').forEach(card=>{
      const w = document.createTreeWalker(card,NodeFilter.SHOW_TEXT);
      let n;
      while(n=w.nextNode()){
        const t = n.textContent.trim();
        if(cats.includes(t)){
          const s = document.createElement('span');
          s.className=`cat-badge ${t}`;
          s.textContent=t;
          n.parentNode.replaceChild(s,n);
          break;
        }
      }
    });
  },2000);
});

// 文章页功能
document.addEventListener('DOMContentLoaded',()=>{
  const isPost = location.pathname.startsWith('/archives/');
  if(!isPost) return;

  // 进度条
  const p = document.createElement('div');
  p.className='reading-progress-container';
  p.innerHTML='<div class="reading-progress-bar" id="readingProgressBar"></div>';
  document.body.prepend(p);
  window.addEventListener('scroll',()=>{
    const b = document.getElementById('readingProgressBar');
    if(!b) return;
    const top = window.pageYOffset;
    const h = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    b.style.width = h>0 ? (top/h)*100 + '%' : '0%';
  });

  // AI摘要
  const ai = document.createElement('div');
  ai.className='ai-summary-card';
  ai.innerHTML=`<div class="ai-summary-left-bar"></div><div class="ai-summary-content"><div class="ai-summary-label">AI 摘要</div><p class="ai-summary-text">本文为校园生活分享内容，欢迎阅读～</p></div>`;
  const article = document.querySelector('article,.post-content,.article-content');
  if(article) article.before(ai);

  // 目录
  const toc = document.createElement('nav');
  toc.className='article-toc';
  toc.innerHTML=`<div class="toc-title">文章目录</div><ul class="toc-list"><li class="toc-item active"><a class="toc-link" href="#title">文章标题</a></li><li class="toc-item"><a class="toc-link" href="#content">正文内容</a></li></ul>`;
  document.body.appendChild(toc);

  // 点赞收藏
  const act = document.createElement('div');
  act.className='post-actions';
  act.innerHTML=`<button class="like-btn" onclick="alert('点赞成功')">❤️ 点赞</button><button class="collect-btn" onclick="alert('收藏成功')">⭐ 收藏</button>`;
  const cmt = document.querySelector('#comment');
  if(cmt) cmt.before(act);

  // 底部点赞
  const likeSection = document.createElement('div');
  likeSection.className='article-like-section';
  likeSection.innerHTML=`<button class="like-button" id="likeButton"><span class="like-icon">♡</span><span>点赞</span><span class="like-count">0</span></button>`;
  if(article) article.after(likeSection);
  
  const btn = document.getElementById('likeButton');
  if(btn){
    let count=0;
    let liked=false;
    btn.addEventListener('click',()=>{
      liked=!liked;
      count+=liked?1:-1;
      btn.classList.toggle('liked',liked);
      btn.querySelector('.like-icon').textContent=liked?'♥':'♡';
      btn.querySelector('.like-count').textContent=count;
    });
  }
});

// 修改登录页标题
document.addEventListener('DOMContentLoaded',()=>{
  if(document.title.includes('Halo')){
    document.title='民大校园生活圈 - 登录';
  }
});
</script>
