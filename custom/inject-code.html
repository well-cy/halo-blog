<style>

}

}

  box-shadow: 0 0 0 3px rgba(196, 84, 40, 0.1);
}

/* ====================== 悬浮写文章按钮 ====================== */
#float-write-btn {

}

.post-actions {
  display: flex;
  gap: 12px;
  margin: 20px 0;
}
.like-btn, .collect-btn {
  padding: 10px 18px;
  border-radius: 30px;
  border: none;

  font-size: 14px;

/* ===================== 5号作业：搜索框 导航栏右侧原版不变 ===================== */
.search-box {
  position: fixed;
  top: 12px;
  right: 20px;
  z-index: 9999;
  width: 240px;
  height: 36px;
}
.search-input {
  width: 100%;
  height: 100%;
  padding: 0 15px 0 35px;
  border: 1px solid #ddd;
  border-radius: 18px;
  outline: none;
  font-size: 14px;
  background: #fff;
  transition: all 0.3s ease;
}
.search-input:focus {
  border-color: #c45428;
  box-shadow: 0 0 0 3px rgba(196,84,40,0.15), 0 0 8px rgba(196,84,40,0.25);
  transform: scale(1.02);
}
.search-input:hover {
  border-color: #ccc;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  color: #999;
  transition: color 0.3s ease;
}
.search-input:focus ~ .search-icon {
  color: #c45428;
}
@media (max-width: 768px) {
  .search-box {
    width: 36px;
    overflow: hidden;
  }
  .search-box:hover { width: 160px; }
  .search-input { opacity: 0; width: 0; border: none; }
  .search-box:hover .search-input { opacity: 1; width: 100%; }
}

/* ===================== 6号作业：全文搜索 模拟效果 ===================== */
/* 搜索结果关键词高亮 */
.highlighted, .search-highlight {

.article-item, .post-card, .search-result-item {

/* 搜索结果页面标题主题色 */
.search-result-title {

}

/* 模拟搜索结果弹窗（不会404） */
#search-modal {

<script>
// 复制分享链接
function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => alert("链接已复制！"));
}

// 点赞功能
function likePost() { alert("点赞成功！感谢支持～"); }

// 收藏功能
function collectPost() { alert("收藏成功！可在个人中心查看～"); }

// 模拟文章数据（用于本地搜索）
const mockArticles = [
  { title: "运动会精彩瞬间回顾", content: "本次运动会有短跑、跳远、接力赛等项目，同学们表现出色。" },
  { title: "校园篮球赛决赛", content: "校队在决赛中以2分险胜，夺得冠军。" },
  { title: "期末复习指南", content: "各科复习重点和时间规划建议，助你高效备考。" }
];

// 文章页面自动插入点赞收藏按钮
document.addEventListener('DOMContentLoaded', function() {
  const path = window.location.pathname;
  if (path !== '/' && !path.includes('/category/') && !path.includes('/tag/')) {
    const actionDiv = document.createElement('div');
    actionDiv.className = 'post-actions';
    actionDiv.innerHTML = `
      <button class="like-btn" onclick="likePost()">❤️ 点赞</button>
      <button class="collect-btn" onclick="collectPost()">⭐ 收藏</button>
    `;
    const comment = document.querySelector('#comment');
    if (comment) comment.before(actionDiv);
  }

  // 砖红色主题的Logo、副标题、页脚（按你原始需求）
  const logo = document.querySelector('.logo a');
  if (logo) logo.innerText = "民大校园博客";

  const subtitle = document.querySelector('.subtitle');
  if (subtitle) subtitle.innerText = "校园清新风格 | 基于 Halo 博客系统";

  const footer = document.querySelector('footer');
  if (footer) footer.innerText = "版权所有 © 2025 民大博客团队";
});
</script>
