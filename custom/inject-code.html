<script>
// 搜索功能 关键词涂鸦描边高亮
window.addEventListener('load', function(){
  const searchInput = document.querySelector('input[placeholder="搜索文章..."]');
  const modal = document.getElementById('search-modal');
  const list = document.getElementById('search-results-list');

  if(!searchInput){
    console.error('未找到搜索框，请检查页面元素');
    return;
  }

  function escapeRegExp(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  searchInput.onkeydown = null;
  searchInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      const kw = this.value.trim();
      if(!kw){
        modal.style.display = 'none';
        return;
      }
      const kwEscaped = escapeRegExp(kw);
      const regex = new RegExp(`(${kwEscaped})`, 'gi');
      const links = Array.from(document.querySelectorAll('a'))
        .filter(a => a.href.includes('/archives/') && a.innerText.trim());
      const results = links
        .filter(a => a.innerText.toLowerCase().includes(kw.toLowerCase()))
        .map(a => ({ title: a.innerText.trim(), url: a.href }));

      if(results.length === 0){
        list.innerHTML = '<div class="search-empty-tip">暂无结果</div>';
      } else {
        const oneRes = results[0];
        const highlightedTitle = oneRes.title.replace(regex, '<span class="kw-highlight">$1</span>');
        list.innerHTML = `<div class="search-result-card"><a href="${oneRes.url}" target="_blank">${highlightedTitle}</a></div>`;
      }
      modal.style.display = 'block';
    }
  });

  document.addEventListener('click', function(e){
    if(!searchInput.contains(e.target) && !modal.contains(e.target)){
      modal.style.display = 'none';
    }
  });
});

async function generateAISummary(content) {
  const API_KEY = 'sk-838ca294a7644336961604339f57c63a';
  const prompt = `请用不超过100字提炼以下文章的核心观点，生成一段简洁流畅的摘要：\n\n${content}`;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 10000);
  try {
    const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+API_KEY },
      body: JSON.stringify({ model:'deepseek-chat', messages:[{role:'user',content:prompt}] }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if(!res.ok) throw new Error('API请求失败');
    const data = await res.json();
    return data.choices?.[0]?.message?.content || '摘要生成失败';
  } catch(e){
    clearTimeout(timeoutId);
    console.error('AI摘要生成失败:', e);
    return e.name === 'AbortError' ? '请求超时，请稍后再试' : '摘要生成失败';
  }
}

const categoryDescriptions = {
  '活动资讯':'活动资讯 | 校园活动、讲座通知、赛事动态一手掌握。',
  '日常生活':'日常生活 | 记录大学生活点滴、学习心得与生活感悟。',
  '社团动态':'社团动态 | 各大社团招新、活动分享与成长故事。',
  '学习笔记':'学习笔记 | 干货分享、期末复习、考证经验、学习方法。',
  '校园新闻':'校园新闻 | 校园大事、通知公告、校园热点全收录。'
};
function updateCategoryIntroByURL() {
  const introBox = document.getElementById('categoryIntro');
  if(!introBox) return;
  const url = window.location.href;
  let currentCat = '';
  if(url.includes('/categories/ri-chang-sheng-huo')) currentCat = '日常生活';
  else if(url.includes('/categories/huo-dong-zi-xun')) currentCat = '活动资讯';
  else if(url.includes('/categories/she-tuan-dong-tai')) currentCat = '社团动态';
  else if(url.includes('/categories/xue-xi-bi-ji')) currentCat = '学习笔记';
  else if(url.includes('/categories/xiao-yuan-xin-wen')) currentCat = '校园新闻';
  else if(url.includes('/categories/mo-ren-fen-lei')) currentCat = '默认分类';
  else {
    introBox.textContent = '这里是分类介绍文字，展示当前分类下的文章内容说明～';
    return;
  }
  introBox.textContent = categoryDescriptions[currentCat] || `这里是${currentCat}分类，分享相关文章内容。`;
}
document.addEventListener('DOMContentLoaded', updateCategoryIntroByURL);

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(() => {
    const cards = document.querySelectorAll('.post-card, .article-item, div[class*="col"]');
    const categories = ['活动资讯','日常生活','社团动态','学习笔记','校园新闻','默认分类'];
    cards.forEach(card => {
      const walker = document.createTreeWalker(card, NodeFilter.SHOW_TEXT);
      let node;
      while(node = walker.nextNode()){
        const text = node.textContent.trim();
        if(categories.includes(text)){
          const badge = document.createElement('span');
          badge.className = `cat-badge ${text}`;
          badge.textContent = text;
          node.parentNode.replaceChild(badge, node);
          break;
        }
      }
    });
  }, 2000);
});

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(() => {
    const WORDS_PER_MINUTE = 400;
    const allCards = document.querySelectorAll('.post-card, .article-item, div[class*="col"]');
    allCards.forEach(card => {
      if(card.querySelector('.read-time-badge')) return;
      const fullText = card.textContent.trim();
      if(fullText.length < 10) return;
      const cleanText = fullText.replace(/发布于|20\d{2}-\d{2}-\d{2}|[a-zA-Z0-9@]+/g, '');
      const readTime = Math.max(1, Math.ceil(cleanText.length / WORDS_PER_MINUTE));
      const badge = document.createElement('div');
      badge.className = 'read-time-badge';
      badge.textContent = `${readTime} 分钟`;
      card.appendChild(badge);
    });
  }, 1000);
});

function initArticleActionSection(articleMain) {
  if(!articleMain || document.querySelector('.article-action-section')) return;
  const actionSection = document.createElement('div');
  actionSection.className = 'article-action-section';
  actionSection.innerHTML = `
    <button type="button" class="action-button like-button" id="likeButton">
      <span class="action-icon">♡</span><span class="action-text">点赞</span><span class="action-count" id="likeCount">0</span>
    </button>
    <button type="button" class="action-button collect-button" id="collectButton">
      <span class="action-icon">☆</span><span class="action-text">收藏</span><span class="action-count" id="collectCount">0</span>
    </button>
  `;
  const insertTarget = articleMain.parentNode;
  if(insertTarget) insertTarget.insertBefore(actionSection, articleMain.nextSibling);
  setupArticleActionButtons();
}
function setupArticleActionButtons(retryCount) {
  retryCount = retryCount || 0;
  const likeButton = document.getElementById('likeButton');
  const collectButton = document.getElementById('collectButton');
  if(!likeButton || !collectButton) return;
  const likeCountEl = document.getElementById('likeCount');
  const collectCountEl = document.getElementById('collectCount');
  const likeIcon = likeButton.querySelector('.action-icon');
  const collectIcon = collectButton.querySelector('.action-icon');
  const topUpvoteCountEl = document.querySelector('[data-upvote-post-name]');
  const topUpvoteBtn = topUpvoteCountEl ? topUpvoteCountEl.closest('.cursor-pointer') : null;
  if(!topUpvoteCountEl && retryCount < 15){
    setTimeout(() => setupArticleActionButtons(retryCount+1), 200);
    return;
  }
  if(likeButton.dataset.bound === 'true') return;
  likeButton.dataset.bound = 'true';
  collectButton.dataset.bound = 'true';
  const articleId = location.pathname;
  const collectStatusMap = JSON.parse(localStorage.getItem('articleCollectStatus') || '{}');
  const collectCountsMap = JSON.parse(localStorage.getItem('articleCollectCounts') || '{}');
  let isCollected = !!collectStatusMap[articleId];
  let collectCountVal = collectCountsMap[articleId] || 0;

  function isTopUpvoted(){
    if(!topUpvoteBtn) return false;
    const filledHeart = topUpvoteBtn.querySelector('.i-tabler-heart-filled');
    return filledHeart ? window.getComputedStyle(filledHeart).display !== 'none' : false;
  }
  function syncLikeFromTop(){
    if(topUpvoteCountEl) likeCountEl.textContent = topUpvoteCountEl.textContent.trim() || '0';
    const liked = isTopUpvoted();
    likeIcon.textContent = liked ? '♥' : '♡';
    likeButton.classList.toggle('liked', liked);
  }
  function updateCollectUI(){
    collectCountEl.textContent = collectCountVal;
    collectIcon.textContent = isCollected ? '★' : '☆';
    collectButton.classList.toggle('collected', isCollected);
  }
  syncLikeFromTop();
  updateCollectUI();
  if(topUpvoteCountEl){
    new MutationObserver(syncLikeFromTop).observe(topUpvoteCountEl, {childList:true,characterData:true,subtree:true});
  }
  likeButton.addEventListener('click', () => {
    if(topUpvoteBtn){
      topUpvoteBtn.click();
      likeButton.classList.add('bouncing');
      setTimeout(() => likeButton.classList.remove('bouncing'), 300);
      syncLikeFromTop();
    }
  });
  collectButton.addEventListener('click', () => {
    isCollected = !isCollected;
    collectCountVal += isCollected ? 1 : -1;
    if(collectCountVal < 0) collectCountVal = 0;
    collectStatusMap[articleId] = isCollected;
    collectCountsMap[articleId] = collectCountVal;
    localStorage.setItem('articleCollectStatus', JSON.stringify(collectStatusMap));
    localStorage.setItem('articleCollectCounts', JSON.stringify(collectCountsMap));
    updateCollectUI();
  });
}

document.addEventListener('DOMContentLoaded', function(){
  const isPostPage = location.pathname.startsWith('/archives/');
  if(isPostPage){
    const progressContainer = document.createElement('div');
    progressContainer.className = 'reading-progress-container';
    progressContainer.innerHTML = '<div class="reading-progress-bar" id="readingProgressBar"></div>';
    document.body.prepend(progressContainer);
    const articleTitle = document.querySelector('h1.post-title, h1.article-title, .post-header h1');
    const articleMain = document.querySelector('#content, div.article-content, div.post-content, article');
    if(articleTitle) articleTitle.id = "article-title-wrap";
    if(articleMain) articleMain.id = "article-content-wrap";

    setTimeout(async () => {
      const existingAICard = document.querySelector('.ai-summary-card');
      if(existingAICard){
        const articleContent = articleMain ? articleMain.innerText.replace(/\s+/g, ' ').trim() : '';
        const textEl = existingAICard.querySelector('.ai-summary-text');
        if(textEl) textEl.textContent = '正在生成摘要...';
        if(articleContent.length > 0){
          const summary = await generateAISummary(articleContent);
          if(textEl) textEl.textContent = summary;
        } else {
          if(textEl) textEl.textContent = "暂无内容摘要";
        }
      }
    }, 500);

    const toc = document.createElement('nav');
    toc.className = 'article-toc';
    toc.id = 'articleToc';
    toc.innerHTML = `
      <div class="toc-title">文章目录</div>
      <ul class="toc-list">
        <li class="toc-item active"><a href="#article-title-wrap" class="toc-link">文章标题</a></li>
        <li class="toc-item"><a href="#article-content-wrap" class="toc-link">文章正文</a></li>
      </ul>
    `;
    document.body.appendChild(toc);
    initArticleActionSection(articleMain);

    window.addEventListener('scroll', () => {
      const bar = document.getElementById('readingProgressBar');
      if(!bar) return;
      const top = window.pageYOffset || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      bar.style.width = height > 0 ? (top / height * 100) + '%' : '0%';
    });

    setTimeout(() => {
      const tocLinks = document.querySelectorAll('.toc-link');
      const headerOffset = 80;
      tocLinks.forEach(link => {
        link.addEventListener('click', function(e){
          e.preventDefault();
          const targetId = this.getAttribute('href').substring(1);
          const targetElement = document.getElementById(targetId);
          if(targetElement){
            const elementTop = targetElement.getBoundingClientRect().top + window.pageYOffset;
            window.scrollTo({top: elementTop - headerOffset, behavior:'smooth'});
          }
        });
      });
    }, 100);

    window.addEventListener('scroll', () => {
      const sections = document.querySelectorAll('#article-title-wrap,#article-content-wrap');
      const items = document.querySelectorAll('.toc-item');
      const scrollY = window.pageYOffset;
      let curr = '';
      if(scrollY < 50) curr = 'article-title-wrap';
      else sections.forEach(s => { if(scrollY >= s.offsetTop - 100) curr = s.id; });
      items.forEach(i => {
        const href = i.querySelector('.toc-link')?.getAttribute('href')?.substring(1);
        i.classList.toggle('active', href === curr);
      });
    });
  }
});
