<script>
function addAIBtn() {
  if (window.location.pathname.indexOf('/uc') === -1) return;
  if (document.getElementById('ai-opt-btn')) return;
  var editor = document.querySelector('.ProseMirror');
  if (!editor) return;
  var btn = document.createElement('button');
  btn.id = 'ai-opt-btn';
  btn.innerText = 'AI优化';
  btn.style.cssText = 'position:fixed;top:10px;right:120px;background:#c45428;color:white;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;z-index:9999;';
  btn.onclick = function() {
    var ed = document.querySelector('.ProseMirror');
    if (!ed) { alert('找不到编辑器'); return; }
    var content = ed.innerText.trim();
    if (!content) { alert('请先输入内容'); return; }
    btn.innerText = '优化中...';
    btn.disabled = true;
    fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer sk-838ca294a7644336961604339f57c63a'},
      body: JSON.stringify({model: 'deepseek-chat', max_tokens: 2000, messages: [{role: 'user', content: '请优化以下文章，语言更流畅活泼，适合校园生活圈风格，保持原意：\n\n' + content}]})
    }).then(function(r) { return r.json(); }).then(function(data) {
      ed.innerText = data.choices[0].message.content;
      btn.innerText = 'AI优化';
      btn.disabled = false;
    }).catch(function(e) {
      alert('优化失败');
      btn.innerText = 'AI优化';
      btn.disabled = false;
    });
  };
  document.body.appendChild(btn);
}
setInterval(addAIBtn, 1000);
</script>
